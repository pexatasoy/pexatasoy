<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="ATIŞ — A round-based tactical shooter, in Godot"><title>ATIŞ — A round-based tactical shooter, in Godot</title><style>@font-face{font-family:'AB';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'ASI';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'AM';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'AS';src:url(data:font/woff2;base64,) format('woff2')}@keyframes nabiz{0%{transform:scale(1);opacity:.85}100%{transform:scale(3.4);opacity:0}}.nabiz{transform-box:fill-box;transform-origin:center;animation:nabiz 2.6s ease-out infinite}@keyframes yanip{0%,49.9%{opacity:1}50%,100%{opacity:0}}.yanip{animation:yanip 1.1s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="golge" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity=".30"/></filter><clipPath id="kart"><rect width="800" height="500" rx="32"/></clipPath></defs><rect width="800" height="500" rx="32" fill="#16181D"/><g clip-path="url(#kart)"><text x="830.0" y="596.0" font-family="'AB',sans-serif" font-size="430" fill="#E8D44D" fill-opacity="0.9" text-anchor="end">A</text><text x="44.0" y="66.0" font-family="'AM',monospace" font-size="16" fill="#EDEDED" fill-opacity="0.6" text-anchor="start" letter-spacing="2.4">NO. 16  ·  GAME</text><rect x="612.8" y="47.0" width="147.2" height="28.0" rx="14.0" fill="#EDEDED" fill-opacity=".07" stroke="#EDEDED" stroke-opacity=".16"/><circle cx="628.9" cy="61.0" r="4.2" fill="#E8D44D"/><text x="642.2" y="66.0" font-family="'AM',monospace" font-size="14" fill="#EDEDED" fill-opacity="0.85" text-anchor="start" letter-spacing="2">PROTOTYPE</text><text x="42.0" y="156.0" font-family="'AB',sans-serif" font-size="66" fill="#EDEDED" text-anchor="start">ATIŞ</text><rect x="154.9" y="148.7" width="27.7" height="7.3" fill="#E8D44D"/><text x="44.0" y="206.0" font-family="'ASI',serif" font-size="28" fill="#EDEDED" text-anchor="start">A round-based tactical shooter, in</text><text x="44.0" y="242.0" font-family="'ASI',serif" font-size="28" fill="#EDEDED" text-anchor="start">Godot</text><text x="44.0" y="286.0" font-family="'AS',serif" font-size="19" fill="#EDEDED" fill-opacity="0.72" text-anchor="start">Five-on-five for friends. Every scene and script</text><text x="44.0" y="313.0" font-family="'AS',serif" font-size="19" fill="#EDEDED" fill-opacity="0.72" text-anchor="start">is plain text, so the whole game is written</text><text x="44.0" y="340.0" font-family="'AS',serif" font-size="19" fill="#EDEDED" fill-opacity="0.72" text-anchor="start">without opening the editor.</text><rect x="44.0" y="432.6" width="40.5" height="28.6" rx="14.3" fill="none" stroke="#EDEDED" stroke-opacity=".35" stroke-width="1.5"/><text x="55.7" y="453.8" font-family="'AM',monospace" font-size="13" fill="#EDEDED" fill-opacity="0.8" text-anchor="start" letter-spacing="1.5">PC</text></g></svg>